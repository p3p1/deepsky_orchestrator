name: Build APK

on:
  workflow_dispatch:       # manuale, dalla tab Actions su GitHub
  push:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Genera progetto Android
        # il repo non contiene android/: lo genera la CI con i nostri file
        run: |
          flutter create . --platforms=android --project-name deepsky_orchestrator
          flutter pub get

      - name: Analisi statica (non blocca la build se ci sono warning)
        run: flutter analyze || true

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepsky-orchestrator-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 90
